name: Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function name (or 'all' for listed functions)"
        required: true
        default: "elevenlabs-transcribe"
        type: choice
        options:
          - elevenlabs-transcribe
          - elevenlabs-webhook
          - ai-summary
          - yookassa-webhook
          - merge-audio
          - all

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Добавь секрет SUPABASE_ACCESS_TOKEN в GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Добавь секрет SUPABASE_PROJECT_REF (например cbyzoatcaleeemrjpfek)"
            exit 1
          fi

      - name: Deploy elevenlabs-transcribe
        if: inputs.function == 'elevenlabs-transcribe' || inputs.function == 'all'
        run: supabase functions deploy elevenlabs-transcribe --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy elevenlabs-webhook
        if: inputs.function == 'elevenlabs-webhook' || inputs.function == 'all'
        run: supabase functions deploy elevenlabs-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy ai-summary
        if: inputs.function == 'ai-summary' || inputs.function == 'all'
        run: supabase functions deploy ai-summary --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy yookassa-webhook
        if: inputs.function == 'yookassa-webhook' || inputs.function == 'all'
        run: supabase functions deploy yookassa-webhook --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy merge-audio
        if: inputs.function == 'merge-audio' || inputs.function == 'all'
        run: supabase functions deploy merge-audio --project-ref "$SUPABASE_PROJECT_REF"
