    <script>
      window.__startupErrors = [];
      (function () {
        var push = function (message) {
          try {
            window.__startupErrors.push(
              "[" + new Date().toISOString() + "] " + message,
            );
            if (window.__startupErrors.length > 20)
              window.__startupErrors.shift();
          } catch (e) {}
        };
        var originalError = console.error;
        console.error = function () {
          try {
            push(
              Array.prototype.map
                .call(arguments, function (x) {
                  return x && x.stack ? x.stack : String(x);
                })
                .join(" "),
            );
          } catch (e) {}
          return originalError.apply(console, arguments);
        };
        var triggerAutoRecover = function (reason) {
          try {
            var attemptsKey = "protokol_autorecover_attempts";
            var attempts =
              parseInt(sessionStorage.getItem(attemptsKey) || "0", 10) || 0;
            if (attempts >= 2) return;
            sessionStorage.setItem(attemptsKey, String(attempts + 1));
            push("auto-recover triggered: " + reason);
            if (window.__autoRecoverApp) window.__autoRecoverApp();
          } catch (e) {}
        };
        var isIgnorableAssetUrl = function (src) {
          try {
            var s = String(src || "");
            if (
              /chrome-extension:|moz-extension:|safari-web-extension:/i.test(s)
            )
              return true;
            if (/[/~]flock\.js(\?|#|$)/i.test(s)) return true;
            return false;
          } catch (e) {
            return false;
          }
        };
        window.addEventListener(
          "error",
          function (e) {
            try {
              if (
                e.target &&
                (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")
              ) {
                var src = e.target.src || e.target.href || "unknown asset";
                if (isIgnorableAssetUrl(src)) return;
                push("asset load error: " + src);
                if (
                  /\/src\/main\.tsx|\/assets\/.+\.(js|css|mjs)/.test(
                    String(src),
                  )
                ) {
                  triggerAutoRecover("asset-load-error");
                }
                return;
              }
            } catch (err) {}
            push(
              "window.error: " +
                e.message +
                " @ " +
                e.filename +
                ":" +
                e.lineno +
                ":" +
                e.colno,
            );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var reason =
            e.reason && e.reason.stack
              ? e.reason.stack
              : String(e.reason || "");
          push("unhandledrejection: " + reason);
          if (
            /Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError|Loading chunk \d+ failed/i.test(
              reason,
            )
          ) {
            triggerAutoRecover("dynamic-import-failed");
          }
        });
        setTimeout(function () {
          if (!window.__appStarted) {
            var root = document.getElementById("root");
            if (!root || root.childElementCount === 0) {
              triggerAutoRecover("startup-timeout");
            }
          }
        }, 8000);
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (window.__appStarted) {
              try {
                sessionStorage.removeItem("protokol_autorecover_attempts");
              } catch (e) {}
            }
          }, 3000);
        });
      })();

      (function () {
        var key = "protokol_sw_cleanup_v7";
        var cleanupStarted = false;
        var isResetVisit =
          window.location.search.indexOf("sw-reset=") !== -1 ||
          window.location.search.indexOf("app-reset=") !== -1;
        var markDone = function () {
          try {
            if (sessionStorage.getItem(key) === "done") return false;
            sessionStorage.setItem(key, "done");
          } catch (e) {}
          return true;
        };
        var reloadOnce = function (reason) {
          if (!markDone() && !reason) return;
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("sw-reset", reason || "1");
            url.searchParams.set("_", Date.now().toString());
            window.location.href = url.toString();
          } catch (e) {
            window.location.reload();
          }
        };
        var cleanup = function (shouldReload, reason) {
          if (cleanupStarted) return;
          cleanupStarted = true;
          var hadWorker = false;
          var registrations =
            "serviceWorker" in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    hadWorker =
                      !!navigator.serviceWorker.controller || regs.length > 0;
                    return Promise.all(
                      regs.map(function (reg) {
                        return reg.unregister().catch(function () {
                          return false;
                        });
                      }),
                    );
                  })
                  .catch(function () {})
              : Promise.resolve();
          var cacheCleanup =
            "caches" in window
              ? caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(
                      keys.map(function (name) {
                        return caches.delete(name).catch(function () {
                          return false;
                        });
                      }),
                    );
                  })
                  .catch(function () {})
              : Promise.resolve();
          Promise.all([registrations, cacheCleanup]).then(function () {
            if (shouldReload && hadWorker && !isResetVisit)
              reloadOnce(reason || "old-sw");
          });
        };
        cleanup(true, "old-sw");
        window.__recoverApp = function () {
          try {
            var btn = document.getElementById("startup-recover-link");
            if (btn) btn.textContent = "Очищаем…";
          } catch (e) {}
          cleanup(false);
          setTimeout(function () {
            reloadOnce("manual");
          }, 250);
        };
        window.__autoRecoverApp = function () {
          cleanup(false);
          setTimeout(function () {
            reloadOnce("auto");
          }, 250);
        };
      })();
    </script>

  <body>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(42, 30%, 96%);
        transition: opacity 280ms ease;
      }
      .dark #app-splash {
        background: hsl(190, 55%, 8%);
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid hsla(190, 60%, 12%, 0.15);
        border-top-color: hsl(190, 75%, 22%);
        animation: app-splash-spin 0.8s linear infinite;
      }
      .dark #app-splash .spinner {
        border-color: hsla(42, 35%, 92%, 0.2);
        border-top-color: hsl(40, 60%, 62%);
      }
      #app-splash .recovery {
        display: none;
        max-width: 560px;
        padding: 0 24px;
        text-align: center;
        color: hsl(190, 55%, 8%);
        font:
          15px/1.45 "Source Sans 3",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .dark #app-splash .recovery {
        color: hsl(42, 35%, 92%);
      }
      #app-splash.is-stuck .spinner {
        display: none;
      }
      #app-splash.is-stuck .recovery {
        display: block;
      }
      #app-splash.is-slow .spinner {
        display: none;
      }
      #app-splash.is-slow .recovery {
        display: block;
      }
      #app-splash .recovery button,
      #app-splash .recovery a.recovery-button {
        margin: 16px 4px 0;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        background: hsl(40, 60%, 52%);
        color: hsl(190, 55%, 8%);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      #app-splash .recovery button.secondary {
        background: transparent;
        color: inherit;
        border: 1px solid currentColor;
      }
      #app-splash .diagnostics {
        margin-top: 14px;
        max-height: 180px;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid currentColor;
        border-radius: 8px;
        padding: 10px;
        opacity: 0.85;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="app-splash" aria-hidden="true">
      <div class="spinner"></div>
      <div class="recovery">
        <div id="startup-message">
          Загрузка заняла больше обычного. Дождитесь окончания загрузки или
          обновите страницу.
        </div>
        <pre class="diagnostics" id="startup-diagnostics">
Диагностика собирается…</pre
        >
        <button type="button" class="secondary" id="startup-copy-report">
          Скопировать отчет
        </button>
        <a
          class="recovery-button"
          id="startup-recover-link"
          href="/?app-reset=manual"
          >Очистить и обновить</a
        >
      </div>
    </div>
    <div id="root"></div>
    <script>
      try {
        var t =
          localStorage.getItem("vite-ui-theme") ||
          localStorage.getItem("theme");
        if (t === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }

      window.__hideSplash = function () {
        var el = document.getElementById("app-splash");
        if (!el) return;
        el.classList.add("is-hidden");
        setTimeout(function () {
          el.remove();
        }, 320);
      };
      function buildStartupReport() {
        var sw = "проверка недоступна";
        try {
          sw =
            navigator.serviceWorker && navigator.serviceWorker.controller
              ? "controller: " +
                (navigator.serviceWorker.controller.scriptURL || "есть")
              : "controller: нет";
        } catch (e) {}
        return [
          "=== ПротоколЪ — отчет запуска ===",
          "Время: " + new Date().toISOString(),
          "URL: " + window.location.href,
          "User-Agent: " + navigator.userAgent,
          "Online: " + navigator.onLine,
          "Service Worker: " + sw,
          "React started: " + !!window.__appStarted,
          "Ошибки:",
          window.__startupErrors && window.__startupErrors.length
            ? window.__startupErrors.join("\n")
            : "—",
        ].join("\n");
      }
      function updateStartupDiagnostics() {
        var box = document.getElementById("startup-diagnostics");
        if (box) box.textContent = buildStartupReport();
      }
      function setStartupMessage(text) {
        var msg = document.getElementById("startup-message");
        if (msg) msg.textContent = text;
      }
      window.__copyStartupReport = function () {
        var report = buildStartupReport();
        updateStartupDiagnostics();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(report).catch(function () {});
        } else {
          var ta = document.createElement("textarea");
          ta.value = report;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
          } catch (e) {}
          document.body.removeChild(ta);
        }
      };
      try {
        var recoverLink = document.getElementById("startup-recover-link");
        if (recoverLink) {
          var recoveryUrl = new URL(
            window.location.origin + window.location.pathname,
          );
          recoveryUrl.searchParams.set("app-reset", "manual");
          recoveryUrl.searchParams.set("_", Date.now().toString());
          recoverLink.href = recoveryUrl.toString();
          recoverLink.addEventListener("click", function (event) {
            event.preventDefault();
            if (window.__recoverApp) window.__recoverApp();
            else window.location.href = recoverLink.href;
          });
        }
        var copyButton = document.getElementById("startup-copy-report");
        if (copyButton)
          copyButton.addEventListener("click", function () {
            window.__copyStartupReport && window.__copyStartupReport();
          });
      } catch (e) {}
      window.addEventListener("app-startup-error", function () {
        var el = document.getElementById("app-splash");
        if (el) el.classList.add("is-stuck");
        updateStartupDiagnostics();
      });
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0 && window.__hideSplash)
          window.__hideSplash();
      }, 1500);
      setTimeout(function () {
        var el = document.getElementById("app-splash");
        var root = document.getElementById("root");
        if (!el) return;
        if (!root || root.childElementCount === 0) {
          el.classList.add("is-slow");
          setStartupMessage(
            "Сайт загружается дольше обычного. На новом домене первая загрузка может занять больше времени.",
          );
          updateStartupDiagnostics();
        } else if (window.__hideSplash) {
          window.__hideSplash();
        }
      }, 6000);
      setTimeout(function () {
        var el = document.getElementById("app-splash");
        var root = document.getElementById("root");
        if (!el) return;
        if (!root || root.childElementCount === 0) {
          el.classList.remove("is-slow");
          el.classList.add("is-stuck");
          setStartupMessage(
            "Не удалось запустить приложение. Если обновление не помогает, скопируйте отчёт и пришлите его нам.",
          );
          updateStartupDiagnostics();
        } else if (window.__hideSplash) {
          window.__hideSplash();
        }
      }, 30000);
    </script>
