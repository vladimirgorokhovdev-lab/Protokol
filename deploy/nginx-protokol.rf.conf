# Оба домена отдают один и тот же сайт (punycode и кириллица — одно имя в DNS).
# SSL (один раз): certbot --nginx -d xn--j1achabchr0f.xn--p1ai -d www.xn--j1achabchr0f.xn--p1ai
# После выпуска сертификата для кириллицы добавьте в certbot: -d протоколъ.рф -d www.протоколъ.рф
# Редирект punycode → кириллица включайте только когда HTTPS на протоколъ.рф уже работает.

server {
    listen 80;
    listen [::]:80;
    server_name
        протоколъ.рф
        www.протоколъ.рф
        xn--j1achabchr0f.xn--p1ai
        www.xn--j1achabchr0f.xn--p1ai;

    root /var/www/protokol/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
}
