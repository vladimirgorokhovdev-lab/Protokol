# Пример для Vite SPA (React). Скопировать в /etc/nginx/sites-available/ и подставить свои значения.
#
# Плейсхолдеры:
#   YOUR_DOMAIN_OR_PUNYCODE  — например протоколъ.рф или xn--j1achabchr0f.xn--p1ai
#   /var/www/protokol/dist   — путь к содержимому папки dist после npm run build
#
# SSL: после установки nginx выполни (один раз):
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#
# upstream для Supabase не нужен — браузер ходит на API напрямую по HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_PUNYCODE www.YOUR_DOMAIN_OR_PUNYCODE;

    # Certbot сам добавит редирект на HTTPS или используй:
    # return 301 https://$host$request_uri;

    root /var/www/protokol/dist;
    index index.html;

    # SPA: все несуществующие пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные файлы Vite — долго кэшировать
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
}

# После certbot появится второй server { listen 443 ssl; ... } или дополнится этот блок.
